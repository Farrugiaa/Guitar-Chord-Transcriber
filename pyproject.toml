[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "guitar-chord-extractor"
version = "0.1.0"
description = "Extract guitar from audio and transcribe chords with extended harmony analysis"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
